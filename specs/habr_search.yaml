source_key: habr_articles
version: v2
description: Двухэтапный парсер Хабра (Поиск -> Полные статьи через внутренний API)
flow: [list, detail]

ui:
  title: Хабр
  icon: "📰"
  description: Статьи и публикации
  param_label: Ключевое слово
  param_hint: "Python, AI, DevOps..."
  param_key: keyword
  default_pages: 3
  default_detail_pages: 0
  tag: Технологии

crawler:
  render: static
  request_headers:
    Origin: "https://habr.com"
    Referer: "https://habr.com/ru/search/"
    Accept: "application/json, text/plain, */*"
    User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"

  limits:
    max_pages: 2 
    # Conservative defaults to avoid rate-limiting and IP blocks
    concurrency: 3        # Хабр лимитирует частые запросы
    requests_per_second: 3.0  # Умеренный ритм, избежать 429

  list:
    # Параметры URL:
    #   query={keyword}  — поисковый запрос
    #   order=relevance  — сортировка по релевантности (date = по дате)
    #   fl=ru            — фильтр по русскому языку статей
    #   hl=ru            — подсветка совпадений на русском
    #   page=1           — номер страницы пагинации
    #   perPage=20       — статей на страницу (max=50 в API, 20 для скорости)
    url_template: "https://habr.com/kek/v2/articles/?query={keyword}&order=relevance&fl=ru&hl=ru&page=1&perPage=20"
    extraction_mode: json
    item_selector: "publicationRefs.*"
    fields:
      detail_url:
        selector: "id"
    pagination:
      mode: offset
    next_page:
      attr: "1"

  detail:
    # {} подставляется ID статьи из list-этапа
    # fl=ru, hl=ru — русская локаль для контента и подсветки
    url_template: "https://habr.com/kek/v2/articles/{}/?fl=ru&hl=ru"
    extraction_mode: json
    item_selector: "@"
    fields:
      external_id:
        selector: "id"
      title:
        selector: "titleHtml" 
      author:
        selector: "author.alias"
      created_at:
        selector: "timePublished"
      views:
        selector: "statistics.readingCount"
      likes:
        selector: "statistics.score"
      comments:
        selector: "statistics.commentsCount"
      text:
        selector: "textHtml"