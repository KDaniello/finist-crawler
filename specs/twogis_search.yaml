source_key: twogis_reviews
version: v4
description: Парсер отзывов 2GIS по ID организации (через Reviews API)
flow: [list, detail]

ui:
  title: 2GIS
  icon: "🗺️"
  description: Отзывы на организацию по ID
  param_label: ID организации
  param_hint: "4504127908652933"
  param_key: branch_id
  default_pages: 1
  default_detail_pages: 3
  tag: Отзывы

crawler:
  render: static
  request_headers:
    Accept: "application/json"
    Accept-Language: "ru-RU,ru;q=0.9"
    Referer: "https://2gis.ru/"
    Origin: "https://2gis.ru"
    User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"

  limits:
    max_pages: 1
    detail_max_pages: 10
    max_records: 500
    request_timeout_sec: 15

  # =======================================================
  # ЭТАП 1: Фиктивный list - извлекает branch_id и передаёт в detail
  # =======================================================
  list:
    url_template: "https://public-api.reviews.2gis.com/3.0/branches/{branch_id}/reviews?limit=1&offset=0&key=6e7e1929-4ea9-4a5d-8c05-d601860389bd&locale=ru_RU"
    extraction_mode: json
    item_selector: "reviews"
    
    fields:
      detail_url:
        selector: "id"
        default: "{branch_id}"
    
    pagination:
      mode: offset
    next_page:
      attr: "0"

  # =======================================================
  # ЭТАП 2: Основной сбор отзывов
  # =======================================================
  detail:
    url_template: "https://public-api.reviews.2gis.com/3.0/branches/{branch_id}/reviews?limit=50&offset=0&is_advertiser=false&fields=meta.providers,meta.branch_rating,meta.branch_reviews_count,meta.total_count,reviews.hiding_reason,reviews.emojis,reviews.trust_factors&rated=true&sort_by=trust&key=6e7e1929-4ea9-4a5d-8c05-d601860389bd&locale=ru_RU"
    extraction_mode: json
    item_selector: "reviews"

    fields:
      external_id:
        selector: "id"
      text:
        selector: "text"
      author:
        selector: "user.name"
      created_at:
        selector: "date_created"
      rating:
        selector: "rating"
      likes:
        selector: "likes_count"
      comments:
        selector: "comments_count"
      provider:
        selector: "provider"

    pagination:
      mode: offset
    next_page:
      attr: "50"